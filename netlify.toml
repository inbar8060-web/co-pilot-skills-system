# Netlify build settings. Netlify detects Next.js and installs its OpenNext adapter
# (@netlify/plugin-nextjs) automatically. Do not add a [[plugins]] entry for it: that pins
# the adapter and opts out of the fixes Next 16 + proxy.ts depend on (>= 5.16).
#
# Environment variables (AI_MODE, Supabase URL/keys, NEXT_PUBLIC_MAX_PDF_MB) are set in the
# Netlify UI/CLI, never here: functions cannot read this file. See docs/DEPLOYMENT.md.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
